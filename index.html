<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6b5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Dove sono stato</title>
<style>
:root{--bg:#eef2f0;--card:#fff;--tx:#14231f;--mu:#5d6e68;--ac:#0b6b5c;--acx:#fff;--bd:#d6dfdb;--er:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#101716;--card:#1a2321;--tx:#e8efec;--mu:#97a8a2;--ac:#4fc2a8;--acx:#06201a;--bd:#2b3835;--er:#f2b8b5;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:6px 0 14px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:16px;border:0;background:none;color:var(--mu);font:inherit;font-weight:600}
.tabs button.on{color:var(--ac)}
#rec{display:block;width:210px;height:210px;margin:18px auto 10px;border-radius:50%;border:0;background:var(--ac);color:var(--acx);font-family:inherit;font-weight:700;font-size:20px;line-height:1.2;cursor:pointer;box-shadow:0 0 0 10px color-mix(in srgb,var(--ac) 18%,transparent)}
#rec:active{transform:scale(.97)}
#rec:disabled{opacity:.65}
#msg{min-height:24px;text-align:center;color:var(--mu);font-size:15px;margin-bottom:10px}
#msg.err{color:var(--er)}
.item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:8px 0}
.when{font-size:13px;color:var(--mu)}
.addr{font-weight:600;word-break:break-word;margin:2px 0}
label.f{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input.big{font-size:17px;font-weight:600}
.note{font-size:13px;color:var(--er);margin-top:6px}
.hd{display:flex;align-items:center;gap:10px}
.dot{flex:none;width:16px;height:16px;border-radius:50%}
.dot.g{background:#2e9e4f}.dot.y{background:#e0a800}.dot.r{background:#d33a2c}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mu);margin:10px 2px 0}
.leg span{display:inline-flex;align-items:center;gap:6px}
.sm{display:flex;gap:16px;margin-top:8px;font-size:14px}
.sm button,.link{background:none;border:0;padding:0;color:var(--ac);font:inherit;text-decoration:underline;cursor:pointer}
.sm .del{color:var(--er);margin-left:auto}
input[type=search],input[type=text],input[type=datetime-local]{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
.sum{color:var(--mu);font-size:14px;margin:10px 2px}
.cnt{font-size:22px;font-weight:700;color:var(--ac)}
.dates{margin:8px 0 0;padding-left:18px;font-size:14px;color:var(--mu)}
.empty{text-align:center;color:var(--mu);margin-top:30px}
.tools{display:flex;gap:16px;justify-content:center;margin-top:26px;font-size:14px}
.view{display:none}.view.on{display:block}
</style>
</head>
<body>
<main>
  <section id="v-rec" class="view on">
    <h1>Dove sono stato</h1>
    <button id="rec">Registra<br>dove sono</button>
    <div id="msg"></div>
    <div id="recent"></div>
  </section>
  <section id="v-all" class="view">
    <h1>Storico</h1>
    <div id="all"></div>
  </section>
  <section id="v-places" class="view">
    <h1>Luoghi</h1>
    <input id="q" type="search" placeholder="Cerca una via, una città, un posto" autocomplete="off">
    <div class="leg"><span><i class="dot g"></i>più di 10 mesi fa</span><span><i class="dot y"></i>tra 4 e 10 mesi fa</span><span><i class="dot r"></i>meno di 4 mesi fa</span></div>
    <div id="sum" class="sum"></div>
    <div id="places"></div>
    <div class="tools">
      <button class="link" id="exp">Esporta copia</button>
      <label class="link" for="imp">Importa copia</label>
      <input id="imp" type="file" accept="application/json" hidden>
    </div>
  </section>
</main>
<nav class="tabs">
  <button id="t-rec" class="on">Registra</button>
  <button id="t-all">Storico</button>
  <button id="t-places">Luoghi</button>
</nav>
<script>
const KEY = `dove_sono_v1`;
let items = [];
const $ = id => document.getElementById(id);

function load(){ try { items = JSON.parse(localStorage.getItem(KEY) || `[]`) || []; } catch(e){ items = []; } items.forEach(i => { i.name = i.name || ``; i.vat = i.vat || ``; }); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(items)); } catch(e){ say(`Memoria piena: esporta una copia e libera spazio.`, true); } }
function say(t, err){ const m = $(`msg`); m.textContent = t; m.className = err ? `err` : ``; }
const norm = s => (s || ``).normalize(`NFD`).replace(/[\u0300-\u036f]/g, ``).toLowerCase().replace(/\s+/g, ` `).trim();
const fmtDate = ts => new Date(ts).toLocaleDateString(`it-IT`, {weekday:`short`, day:`numeric`, month:`long`, year:`numeric`});
const fmtTime = ts => new Date(ts).toLocaleTimeString(`it-IT`, {hour:`2-digit`, minute:`2-digit`});
const monthsAgoLimit = m => { const d = new Date(); d.setMonth(d.getMonth() - m); return d.getTime(); };
function recency(ts){
  if(ts < monthsAgoLimit(10)) return {c:`g`, t:`più di 10 mesi fa`};
  if(ts <= monthsAgoLimit(4)) return {c:`y`, t:`tra 4 e 10 mesi fa`};
  return {c:`r`, t:`meno di 4 mesi fa`};
}
const hasCivic = a => /\d/.test((a || ``).split(`,`)[0]);
const toLocalInput = ts => { const d = new Date(ts - new Date(ts).getTimezoneOffset() * 60000); return d.toISOString().slice(0, 16); };

async function reverse(it){
  const u = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&accept-language=it&lat=${it.lat}&lon=${it.lng}`;
  const r = await fetch(u);
  if(!r.ok) throw new Error(`geo`);
  const j = await r.json(), a = j.address || {};
  const road = a.road || a.pedestrian || a.footway || a.path || a.square || a.neighbourhood || ``;
  const street = [road, a.house_number].filter(Boolean).join(` `);
  const town = a.city || a.town || a.village || a.municipality || a.hamlet || ``;
  const cap = [a.postcode, town].filter(Boolean).join(` `);
  return [street, cap].filter(Boolean).join(`, `) || (j.display_name || ``);
}

async function fillMissing(){
  for(const it of items){
    if(it.address) continue;
    try { it.address = await reverse(it); save(); renderAll(); } catch(e){ break; }
    await new Promise(r => setTimeout(r, 1100));
  }
}

$(`rec`).addEventListener(`click`, () => {
  if(!navigator.geolocation){ say(`Questo telefono non fornisce la posizione.`, true); return; }
  const b = $(`rec`); b.disabled = true; say(`Rilevo la posizione…`);
  navigator.geolocation.getCurrentPosition(async p => {
    const it = {id:String(Date.now()), ts:Date.now(), lat:p.coords.latitude, lng:p.coords.longitude, address:``, name:``, vat:``};
    items.push(it); save(); renderAll();
    if(navigator.vibrate) navigator.vibrate(60);
    say(`Cerco l’indirizzo…`);
    try { it.address = await reverse(it); save(); renderAll(); say(hasCivic(it.address) ? `Registrato.` : `Registrato, ma manca il numero civico: aggiungilo nel campo.`, !hasCivic(it.address)); }
    catch(e){ say(`Registrato senza indirizzo: lo cercherò appena c’è connessione, oppure scrivilo a mano.`, true); }
    b.disabled = false;
  }, e => {
    say(e.code === 1 ? `Permesso di posizione negato. Attivalo per questa app nelle impostazioni del telefono.` : `Posizione non disponibile. Riprova all’aperto.`, true);
    b.disabled = false;
  }, {enableHighAccuracy:true, timeout:20000, maximumAge:0});
});

function field(labelText, value, placeholder, cls, onChange, type, mode){
  const wrap = document.createDocumentFragment();
  const l = document.createElement(`label`); l.className = `f`; l.textContent = labelText;
  const i = document.createElement(`input`); i.type = type || `text`; i.value = value || ``; i.placeholder = placeholder || ``;
  if(cls) i.className = cls; if(mode) i.inputMode = mode;
  i.autocomplete = `off`;
  i.addEventListener(`change`, () => onChange(i.value));
  wrap.append(l, i); return wrap;
}

function itemCard(it){
  const c = document.createElement(`div`); c.className = `item`;
  c.appendChild(field(`Indirizzo con numero civico`, it.address, `Via e numero, CAP, città`, `big`, v => { it.address = v.trim(); save(); renderAll(); }));
  if(it.address && !hasCivic(it.address)){ const n = document.createElement(`div`); n.className = `note`; n.textContent = `Manca il numero civico: aggiungilo nel campo.`; c.appendChild(n); }
  if(!it.address){ const n = document.createElement(`div`); n.className = `note`; n.textContent = `Indirizzo non ancora trovato: scrivilo a mano o attendi la connessione.`; c.appendChild(n); }
  c.appendChild(field(`Nome attività`, it.name, ``, ``, v => { it.name = v.trim(); save(); renderAll(); }));
  c.appendChild(field(`Partita IVA`, it.vat, ``, ``, v => { it.vat = v.trim(); save(); renderAll(); }, `text`, `numeric`));
  c.appendChild(field(`Data e ora`, toLocalInput(it.ts), ``, ``, v => { const t = new Date(v).getTime(); if(!isNaN(t)){ it.ts = t; save(); renderAll(); } }, `datetime-local`));
  const s = document.createElement(`div`); s.className = `sm`;
  const d = document.createElement(`button`); d.className = `del`; d.textContent = `Elimina`;
  d.addEventListener(`click`, () => { if(confirm(`Eliminare questa registrazione?`)){ items = items.filter(x => x.id !== it.id); save(); renderAll(); } });
  s.appendChild(d); c.appendChild(s); return c;
}

function renderList(el, list, emptyText){
  el.textContent = ``;
  if(!list.length){ const e = document.createElement(`div`); e.className = `empty`; e.textContent = emptyText; el.appendChild(e); return; }
  list.forEach(it => el.appendChild(itemCard(it)));
}
const sorted = () => items.slice().sort((a, b) => b.ts - a.ts);

function groups(){
  const m = new Map();
  items.forEach(it => {
    const k = it.address ? norm(it.address) : `__none__`;
    if(!m.has(k)) m.set(k, {label: it.address || `Indirizzo non ancora trovato`, items: []});
    m.get(k).items.push(it);
  });
  return [...m.values()];
}

function renderPlaces(){
  const q = norm($(`q`).value).split(` `).filter(Boolean);
  let gs = groups();
  if(q.length) gs = gs.filter(g => { const hay = norm(g.items.map(i => [i.address, i.name, i.vat].join(` `)).join(` `)); return q.every(t => hay.includes(t)); });
  gs.forEach(g => g.items.sort((a, b) => a.ts - b.ts));
  gs.sort((a, b) => b.items.length - a.items.length || b.items[b.items.length-1].ts - a.items[a.items.length-1].ts);
  const total = gs.reduce((s, g) => s + g.items.length, 0);
  $(`sum`).textContent = items.length ? `${total} registrazioni in ${gs.length} indirizzi` : ``;
  const l = $(`places`); l.textContent = ``;
  if(!gs.length){ const e = document.createElement(`div`); e.className = `empty`; e.textContent = items.length ? `Nessun indirizzo trovato.` : `Non hai ancora registrato nessun luogo.`; l.appendChild(e); return; }
  gs.forEach(g => {
    const box = document.createElement(`div`); box.className = `item`;
    const n = document.createElement(`div`); n.className = `cnt`; n.textContent = g.items.length === 1 ? `1 volta` : `${g.items.length} volte`;
    const a = document.createElement(`div`); a.className = `addr`; a.textContent = g.label;
    const last = g.items[g.items.length - 1];
    const rc = recency(last.ts);
    const hd = document.createElement(`div`); hd.className = `hd`;
    const dot = document.createElement(`i`); dot.className = `dot ` + rc.c; dot.title = `Ultima volta: ` + rc.t; dot.setAttribute(`role`, `img`); dot.setAttribute(`aria-label`, `Ultima volta: ` + rc.t);
    hd.append(dot, n);
    box.append(hd, a);
    const names = [...new Set(g.items.map(i => [i.name, i.vat && `P.IVA ${i.vat}`].filter(Boolean).join(` · `)).filter(Boolean))];
    names.forEach(t => { const w = document.createElement(`div`); w.className = `when`; w.textContent = t; box.appendChild(w); });
    const w = document.createElement(`div`); w.className = `when`; w.textContent = `Ultima volta: ${fmtDate(last.ts)} (${rc.t})`; box.appendChild(w);
    const t = document.createElement(`button`); t.className = `link`; t.textContent = `Mostra le date`;
    const ul = document.createElement(`ul`); ul.className = `dates`; ul.hidden = true;
    g.items.slice().reverse().forEach(i => { const li = document.createElement(`li`); li.textContent = `${fmtDate(i.ts)}, ${fmtTime(i.ts)}`; ul.appendChild(li); });
    t.addEventListener(`click`, () => { ul.hidden = !ul.hidden; t.textContent = ul.hidden ? `Mostra le date` : `Nascondi le date`; });
    box.append(t, ul); l.appendChild(box);
  });
}

function renderAll(){
  const ae = document.activeElement; if(ae && ae.tagName === `INPUT` && ae.id !== `q`) ae.blur();
  renderList($(`recent`), sorted().slice(0, 3), `Premi il pulsante per registrare dove ti trovi.`);
  renderList($(`all`), sorted(), `Nessuna registrazione.`);
  renderPlaces();
}
$(`q`).addEventListener(`input`, renderPlaces);

function tab(name){
  ['rec', 'all', 'places'].forEach(n => { $(`v-` + n).classList.toggle(`on`, n === name); $(`t-` + n).classList.toggle(`on`, n === name); });
}
['rec', 'all', 'places'].forEach(n => $(`t-` + n).addEventListener(`click`, () => tab(n)));

$(`exp`).addEventListener(`click`, () => {
  const blob = new Blob([JSON.stringify(items, null, 2)], {type:`application/json`});
  const a = document.createElement(`a`); a.href = URL.createObjectURL(blob);
  a.download = `dove-sono-stato-${new Date().toISOString().slice(0, 10)}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
});
$(`imp`).addEventListener(`change`, async e => {
  const f = e.target.files[0]; if(!f) return;
  try {
    const data = JSON.parse(await f.text());
    if(!Array.isArray(data)) throw new Error(`fmt`);
    const ids = new Set(items.map(i => i.id)); let n = 0;
    data.forEach(d => { if(d && d.id && typeof d.lat === `number` && typeof d.lng === `number` && !ids.has(String(d.id))){ items.push({id:String(d.id), ts:+d.ts, lat:d.lat, lng:d.lng, address:String(d.address || ``), name:String(d.name || ``), vat:String(d.vat || ``)}); n++; } });
    save(); renderAll(); alert(`Importate ${n} registrazioni.`);
  } catch(err){ alert(`File non valido.`); }
  e.target.value = ``;
});

load(); renderAll(); fillMissing();
window.addEventListener(`online`, fillMissing);
if(`serviceWorker` in navigator) navigator.serviceWorker.register(`sw.js`).catch(() => {});
</script>
</body>
</html>
